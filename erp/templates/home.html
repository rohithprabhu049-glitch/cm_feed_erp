<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CM Cattle Feed ERP</title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Google Font -->

    <link rel="preconnect"
    href="https://fonts.googleapis.com">

    <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card{
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }

        .title{
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            color: #0f172a;
        }

        .subtitle{
            text-align: center;
            color: gray;
            margin-top: 10px;
            margin-bottom: 35px;
        }

        .login-btn{
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: 0.3s;
            border: none;
        }

        .admin-btn{
            background: #0f172a;
            color: white;
        }

        .sales-btn{
            background: #16a34a;
            color: white;
        }

        .manufacture-btn{
            background: #ea580c;
            color: white;
        }

        .login-btn:hover{
            transform: translateY(-3px);
            opacity: 0.9;
        }

        @media(max-width:576px){

            .main-card{
                padding: 30px 20px;
            }

            .title{
                font-size: 26px;
            }

            .login-btn{
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

    <div class="main-card">

        <h1 class="title">
            CM Cattle Feed ERP
        </h1>

        <p class="subtitle">
            Complete Sales & Manufacture Management System
        </p>

        <a href="/dashboard">

            <button class="login-btn admin-btn">

                Admin Login

            </button>

        </a>

        <a href="/sales">

            <button class="login-btn sales-btn">

                Sales Login

            </button>

        </a>

        <a href="/production">

            <button class="login-btn manufacture-btn">

                Manufacture Login

            </button>

        </a>

    </div>

</body>

</html>
