<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Production</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body
class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="mb-4">

            Edit Production

        </h2>

        <form method="POST">

            {% csrf_token %}

            <label class="mb-2">

                Date

            </label>

            <input type="date"
                   name="date"
                   value="{{ production.date|date:'Y-m-d' }}"
                   class="form-control mb-3"
                   required>

            <label class="mb-2">

                Product

            </label>

            <select name="product"
                    class="form-control mb-3"
                    required>

                {% for product in products %}

                <option value="{{ product.id }}"

                    {% if product.id == production.product.id %}
                    selected
                    {% endif %}>

                    {{ product.name }}

                </option>

                {% endfor %}

            </select>

            <label class="mb-2">

                Bag Count

            </label>

            <input type="number"
                   name="bag_count"
                   value="{{ production.bag_count }}"
                   class="form-control mb-4"
                   required>

            <button type="submit"
                    class="btn btn-success">

                Update Production

            </button>

        </form>

    </div>

</div>

</body>

</html>
