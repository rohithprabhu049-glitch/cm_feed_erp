<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manufacture Module</title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Google Font -->

    <link rel="preconnect"
    href="https://fonts.googleapis.com">

    <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <style>

        body{
            background: #f1f5f9;
            font-family: 'Poppins', sans-serif;
        }

        /* Sidebar */

        .sidebar{
            width: 260px;
            height: 100vh;
            background: #0f172a;
            color: white;
            position: fixed;
            padding: 25px;
        }

        .sidebar h2{
            font-weight: 700;
            margin-bottom: 40px;
        }

        .sidebar a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: 0.3s;
            font-weight: 500;
        }

        .sidebar a:hover{
            background: #1e293b;
        }

        /* Main Content */

        .main-content{
            margin-left: 280px;
            padding: 30px;
        }

        .card-box{
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.08);
        }

        .title{
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle{
            color: gray;
            margin-bottom: 30px;
        }

        label{
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select{
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            margin-bottom: 20px;
        }

        .submit-btn{
            width: 100%;
            background: #ea580c;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
        }

        .submit-btn:hover{
            background: #c2410c;
        }

        /* Mobile Responsive */

        @media(max-width:768px){

            .sidebar{
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content{
                margin-left: 0;
                padding: 15px;
            }

        }

    </style>

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>
            Manufacture
        </h2>

        <a href="/stock">

            Current Stock

        </a>

        <a href="/production">

            Production

        </a>

        <a href="/raw-material">

            Raw Materials

        </a>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <div class="card-box">

            <h1 class="title">

                Production Entry

            </h1>

            <p class="subtitle">

                Add Newly Manufactured Stock

            </p>

            <form method="POST">

                {% csrf_token %}

                <!-- Product -->

                <label>
                    Product
                </label>

                <select name="product" required>

                    <option value="">
                        Select Product
                    </option>

                    <option value="1">
                        Pellet 50kg
                    </option>

                    <option value="2">
                        Pellet 70kg
                    </option>

                    <option value="3">
                        Mixed Feed 50kg
                    </option>

                </select>

                <!-- Date -->

                <label>
                    Date
                </label>

                <input type="date"
                       name="date"
                       required>

                <!-- Bag Count -->

                <label>
                    Bag Count
                </label>

                <input type="number"
                       name="bag_count"
                       placeholder="Enter Bag Count"
                       required>

                <button type="submit"
                        class="submit-btn">

                    Add Production

                </button>

            </form>

        </div>

    </div>

</body>

</html>
