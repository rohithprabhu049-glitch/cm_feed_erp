<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Sales Login | CM ERP
    </title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Google Font -->

    <link rel="preconnect"
    href="https://fonts.googleapis.com">

    <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Inter',sans-serif;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

            background:
            linear-gradient(
                135deg,
                #ecfdf5,
                #d1fae5,
                #f0fdf4
            );

            overflow-x:hidden;

            position:relative;

        }

        /* BACKGROUND */

        body::before{

            content:"";

            position:absolute;

            width:420px;

            height:420px;

            background:#22c55e;

            border-radius:50%;

            top:-180px;

            left:-160px;

            filter:blur(130px);

            opacity:0.25;

        }

        body::after{

            content:"";

            position:absolute;

            width:350px;

            height:350px;

            background:#16a34a;

            border-radius:50%;

            bottom:-150px;

            right:-130px;

            filter:blur(130px);

            opacity:0.20;

        }

        /* WRAPPER */

        .login-wrapper{

            width:100%;

            max-width:500px;

            position:relative;

            z-index:2;

        }

        /* CARD */

        .login-card{

            width:100%;

            background:rgba(255,255,255,0.82);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.5);

            border-radius:34px;

            padding:42px 36px;

            box-shadow:
            0px 20px 50px rgba(15,23,42,0.10);

            transition:0.3s ease;

        }

        .login-card:hover{

            transform:translateY(-4px);

        }

        /* LOGO */

        .logo-box{

            width:95px;

            height:95px;

            margin:auto;

            border-radius:28px;

            background:
            linear-gradient(
                135deg,
                #16a34a,
                #22c55e
            );

            display:flex;

            justify-content:center;

            align-items:center;

            margin-bottom:26px;

            box-shadow:
            0px 15px 35px rgba(34,197,94,0.28);

        }

        .logo-box i{

            color:white;

            font-size:42px;

        }

        /* TITLE */

        .title{

            text-align:center;

            font-size:34px;

            font-weight:800;

            color:#0f172a;

            margin-bottom:10px;

        }

        .subtitle{

            text-align:center;

            color:#64748b;

            font-size:15px;

            line-height:1.7;

            margin-bottom:34px;

        }

        /* ALERT */

        .alert{

            border:none;

            border-radius:16px;

            padding:14px 16px;

            font-size:14px;

            margin-bottom:22px;

        }

        /* LABEL */

        .form-label{

            font-size:14px;

            font-weight:700;

            color:#14532d;

            margin-bottom:10px;

        }

        /* INPUT */

        .input-group{

            margin-bottom:22px;

        }

        .input-group-text{

            background:white;

            border:1px solid #bbf7d0;

            border-right:none;

            border-radius:16px 0px 0px 16px;

            color:#16a34a;

            padding:0px 16px;

            font-size:18px;

        }

        .form-control{

            height:58px;

            border:1px solid #bbf7d0;

            border-left:none;

            border-radius:0px 16px 16px 0px;

            font-size:15px;

            background:white;

            color:#0f172a;

        }

        .form-control:focus{

            border-color:#22c55e;

            box-shadow:none;

        }

        .form-control::placeholder{

            color:#94a3b8;

        }

        /* BUTTON */

        .login-btn{

            width:100%;

            height:60px;

            border:none;

            border-radius:20px;

            background:
            linear-gradient(
                135deg,
                #16a34a,
                #22c55e
            );

            color:white;

            font-size:17px;

            font-weight:700;

            transition:0.3s ease;

            margin-top:8px;

            box-shadow:
            0px 14px 28px rgba(34,197,94,0.22);

        }

        .login-btn:hover{

            transform:translateY(-3px);

            opacity:0.96;

        }

        .login-btn i{

            margin-right:8px;

        }

        /* EXTRA */

        .extra-links{

            display:flex;

            justify-content:space-between;

            align-items:center;

            gap:10px;

            margin-top:24px;

            flex-wrap:wrap;

        }

        .back-btn{

            text-decoration:none;

            color:#475569;

            font-size:14px;

            font-weight:600;

            transition:0.3s ease;

        }

        .back-btn:hover{

            color:#16a34a;

        }

        .support-text{

            font-size:13px;

            color:#64748b;

        }

        /* FOOTER */

        .footer-text{

            text-align:center;

            margin-top:28px;

            color:#64748b;

            font-size:13px;

            font-weight:500;

        }

        /* TABLET */

        @media(max-width:768px){

            .login-card{

                padding:36px 28px;

                border-radius:28px;

            }

            .title{

                font-size:30px;

            }

        }

        /* MOBILE */

        @media(max-width:576px){

            body{

                padding:14px;

            }

            .login-wrapper{

                max-width:100%;

            }

            .login-card{

                padding:28px 20px;

                border-radius:24px;

            }

            .logo-box{

                width:78px;

                height:78px;

                border-radius:22px;

            }

            .logo-box i{

                font-size:34px;

            }

            .title{

                font-size:25px;

            }

            .subtitle{

                font-size:14px;

                margin-bottom:28px;

            }

            .form-control{

                height:52px;

                font-size:14px;

            }

            .input-group-text{

                font-size:16px;

            }

            .login-btn{

                height:54px;

                font-size:15px;

                border-radius:16px;

            }

            .extra-links{

                flex-direction:column;

                align-items:flex-start;

            }

        }

    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- LOGO -->

            <div class="logo-box">

                <i class="bi bi-cart-check-fill"></i>

            </div>

            <!-- TITLE -->

            <h1 class="title">

                Sales Login

            </h1>

            <p class="subtitle">

                Access CM Cattle Feed ERP Sales Management Portal

            </p>

            <!-- DJANGO MESSAGE -->

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}

                <!-- USERNAME -->

                <label class="form-label">

                    Username

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person-fill"></i>

                    </span>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter Username"
                           required>

                </div>

                <!-- PASSWORD -->

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock-fill"></i>

                    </span>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter Password"
                           required>

                </div>

                <!-- LOGIN BUTTON -->

                <button type="submit"
                        class="login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login to Sales

                </button>

            </form>

            <!-- EXTRA -->

            <div class="extra-links">

                <a href="/"
                   class="back-btn">

                    <i class="bi bi-arrow-left"></i>

                    Back To Home

                </a>

                <div class="support-text">

                    Secure ERP Access

                </div>

            </div>

            <!-- FOOTER -->

            <div class="footer-text">

                © 2026 CM Cattle Feed ERP System

            </div>

        </div>

    </div>

</body>

</html>
