<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Sale</title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Google Font -->

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <style>

        body{
            background:#f1f5f9;
            font-family:'Poppins',sans-serif;
        }

        .main-container{
            padding:30px;
        }

        .card-box{
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0px 8px 25px rgba(0,0,0,0.08);
            max-width:1000px;
            margin:auto;
        }

        .title{
            font-size:32px;
            font-weight:700;
            color:#0f172a;
            margin-bottom:10px;
        }

        .subtitle{
            color:gray;
            margin-bottom:30px;
        }

        label{
            font-weight:600;
            margin-bottom:8px;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border-radius:10px;
            border:1px solid #cbd5e1;
            margin-bottom:20px;
        }

        .update-btn{
            background:#2563eb;
            color:white;
            border:none;
            padding:14px;
            border-radius:12px;
            font-size:17px;
            font-weight:600;
            width:100%;
        }

        .update-btn:hover{
            background:#1d4ed8;
        }

        .cancel-btn{
            background:#dc2626;
            color:white;
            border:none;
            padding:14px;
            border-radius:12px;
            font-size:17px;
            font-weight:600;
            width:100%;
            text-decoration:none;
            display:block;
            text-align:center;
        }

        .cancel-btn:hover{
            background:#b91c1c;
            color:white;
        }

        .bill-box{
            background:#dcfce7;
            color:#166534;
            padding:12px 18px;
            border-radius:14px;
            display:inline-block;
            font-weight:700;
            margin-bottom:25px;
        }

        @media(max-width:768px){

            .main-container{
                padding:15px;
            }

            .title{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

<div class="container-fluid main-container">

    <div class="card-box">

        <h1 class="title">

            Edit Sales Entry

        </h1>

        <p class="subtitle">

            Update Existing Sales Information

        </p>

        <!-- BILL NUMBER -->

        <div class="bill-box">

            Bill Number :
            {{ sale.bill_no }}

        </div>

        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <!-- DATE -->

                <div class="col-md-6">

                    <label>Date</label>

                    <input type="date"
                           name="date"
                           value="{{ sale.date|date:'Y-m-d' }}"
                           required>

                </div>

                <!-- RD NAME -->

                <div class="col-md-6">

                    <label>RD Name</label>

                    <input type="text"
                           name="rd_name"
                           value="{{ sale.rd_name }}"
                           required>

                </div>

                <!-- RETAIL PARTNER -->

                <div class="col-md-6">

                    <label>Retail Partner</label>

                    <input type="text"
                           name="retail_partner"
                           value="{{ sale.retail_partner }}"
                           required>

                </div>

                <!-- MOBILE -->

                <div class="col-md-6">

                    <label>Mobile Number</label>

                    <input type="text"
                           name="mobile"
                           value="{{ sale.mobile }}"
                           required>

                </div>

                <!-- ADDRESS -->

                <div class="col-md-12">

                    <label>Address</label>

                    <textarea name="address"
                              rows="3"
                              required>{{ sale.address }}</textarea>

                </div>

                <!-- PRODUCT -->

                <div class="col-md-6">

                    <label>Product</label>

                    <select name="product" required>

                        {% for product in products %}

                        <option value="{{ product.id }}"

                            {% if product.id == sale.product.id %}

                                selected

                            {% endif %}>

                            {{ product.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- BAG COUNT -->

                <div class="col-md-6">

                    <label>Bag Count</label>

                    <input type="number"
                           name="bag_count"
                           value="{{ sale.bag_count }}"
                           required>

                </div>

                <!-- UNIT PRICE -->

                <div class="col-md-6">

                    <label>Unit Price</label>

                    <input type="number"
                           step="0.01"
                           name="unit_price"
                           value="{{ sale.unit_price }}"
                           required>

                </div>

                <!-- PAYMENT -->

                <div class="col-md-6">

                    <label>Payment Term</label>

                    <select name="payment_term"
                            required>

                        <option value="Cash"

                            {% if sale.payment_term == 'Cash' %}
                            selected
                            {% endif %}>

                            Cash

                        </option>

                        <option value="GPay"

                            {% if sale.payment_term == 'GPay' %}
                            selected
                            {% endif %}>

                            GPay

                        </option>

                    </select>

                </div>

            </div>

            <!-- BUTTONS -->

            <div class="row mt-3">

                <div class="col-md-6">

                    <button type="submit"
                            class="update-btn">

                        Update Sale

                    </button>

                </div>

                <div class="col-md-6">

                    <a href="/sales-details/"
                       class="cancel-btn">

                        Cancel

                    </a>

                </div>

            </div>

        </form>

    </div>

</div>

</body>

</html>
