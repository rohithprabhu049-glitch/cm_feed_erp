<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Edit Sales | CM ERP
    </title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Google Font -->

    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:
            linear-gradient(
                135deg,
                #f8fafc,
                #e2e8f0
            );

            font-family:'Inter',sans-serif;

            min-height:100vh;

            padding:25px;

        }

        .main-wrapper{

            max-width:1100px;

            margin:auto;

        }

        /* CARD */

        .form-card{

            background:rgba(255,255,255,0.8);

            backdrop-filter:blur(14px);

            border-radius:32px;

            padding:40px;

            box-shadow:
            0px 15px 40px rgba(15,23,42,0.08);

            border:1px solid rgba(255,255,255,0.4);

        }

        /* HEADER */

        .top-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            flex-wrap:wrap;

            gap:20px;

            margin-bottom:35px;

        }

        .title{

            font-size:34px;

            font-weight:800;

            color:#0f172a;

            margin-bottom:8px;

        }

        .subtitle{

            color:#64748b;

            font-size:15px;

        }

        .bill-box{

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color:white;

            padding:14px 22px;

            border-radius:18px;

            font-weight:700;

            box-shadow:
            0px 10px 25px rgba(37,99,235,0.25);

        }

        /* FORM */

        .form-label{

            font-weight:700;

            color:#334155;

            margin-bottom:10px;

            font-size:14px;

        }

        .input-group{

            margin-bottom:22px;

        }

        .input-group-text{

            background:white;

            border:1px solid #dbeafe;

            border-right:none;

            border-radius:16px 0px 0px 16px;

            color:#2563eb;

            padding:0px 16px;

        }

        .form-control,
        .form-select{

            height:56px;

            border:1px solid #dbeafe;

            border-left:none;

            border-radius:0px 16px 16px 0px;

            font-size:15px;

            background:white;

        }

        textarea.form-control{

            height:auto;

            min-height:120px;

            padding-top:16px;

            border-left:1px solid #dbeafe;

            border-radius:16px;

        }

        .form-control:focus,
        .form-select:focus{

            border-color:#60a5fa;

            box-shadow:none;

        }

        /* BUTTONS */

        .btn-area{

            margin-top:15px;

        }

        .update-btn{

            width:100%;

            height:58px;

            border:none;

            border-radius:18px;

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color:white;

            font-size:17px;

            font-weight:700;

            transition:0.3s;

            box-shadow:
            0px 10px 20px rgba(37,99,235,0.25);

        }

        .update-btn:hover{

            transform:translateY(-2px);

        }

        .cancel-btn{

            width:100%;

            height:58px;

            border:none;

            border-radius:18px;

            background:
            linear-gradient(
                135deg,
                #dc2626,
                #ef4444
            );

            color:white;

            font-size:17px;

            font-weight:700;

            display:flex;

            justify-content:center;

            align-items:center;

            text-decoration:none;

            transition:0.3s;

            box-shadow:
            0px 10px 20px rgba(220,38,38,0.22);

        }

        .cancel-btn:hover{

            transform:translateY(-2px);

            color:white;

        }

        /* RESPONSIVE */

        @media(max-width:991px){

            .form-card{

                padding:30px;

            }

        }

        @media(max-width:768px){

            body{

                padding:15px;

            }

            .form-card{

                padding:25px 20px;

                border-radius:24px;

            }

            .title{

                font-size:28px;

            }

            .top-header{

                flex-direction:column;

                align-items:flex-start;

            }

            .bill-box{

                width:100%;

                text-align:center;

            }

        }

        @media(max-width:576px){

            .title{

                font-size:24px;

            }

            .subtitle{

                font-size:14px;

            }

            .form-control,
            .form-select{

                height:52px;

                font-size:14px;

            }

            .update-btn,
            .cancel-btn{

                height:54px;

                font-size:15px;

            }

        }

    </style>

</head>

<body>

    <div class="main-wrapper">

        <div class="form-card">

            <!-- HEADER -->

            <div class="top-header">

                <div>

                    <h1 class="title">

                        Edit Sales Entry

                    </h1>

                    <p class="subtitle">

                        Update existing sales information easily

                    </p>

                </div>

                <div class="bill-box">

                    Bill No :
                    {{ sale.bill_no }}

                </div>

            </div>

            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <!-- DATE -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            Date

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-calendar-event"></i>

                            </span>

                            <input type="date"
                                   class="form-control"
                                   name="date"
                                   value="{{ sale.date|date:'Y-m-d' }}"
                                   required>

                        </div>

                    </div>

                    <!-- RD NAME -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            RD Name

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person"></i>

                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="rd_name"
                                   value="{{ sale.rd_name }}"
                                   required>

                        </div>

                    </div>

                    <!-- RETAIL -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            Retail Partner

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-shop"></i>

                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="retail_partner"
                                   value="{{ sale.retail_partner }}"
                                   required>

                        </div>

                    </div>

                    <!-- MOBILE -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            Mobile Number

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-telephone"></i>

                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="mobile"
                                   value="{{ sale.mobile }}"
                                   required>

                        </div>

                    </div>

                    <!-- ADDRESS -->

                    <div class="col-12">

                        <label class="form-label">

                            Address

                        </label>

                        <textarea name="address"
                                  class="form-control"
                                  rows="4"
                                  required>{{ sale.address }}</textarea>

                    </div>

                    <!-- PRODUCT -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            Product

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-box-seam"></i>

                            </span>

                            <select name="product"
                                    class="form-select"
                                    required>

                                {% for product in products %}

                                <option value="{{ product.id }}"

                                    {% if product.id == sale.product.id %}

                                        selected

                                    {% endif %}>

                                    {{ product.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                    </div>

                    <!-- BAG COUNT -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            Bag Count

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-stack"></i>

                            </span>

                            <input type="number"
                                   class="form-control"
                                   name="bag_count"
                                   value="{{ sale.bag_count }}"
                                   required>

                        </div>

                    </div>

                    <!-- UNIT PRICE -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            Unit Price

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-currency-rupee"></i>

                            </span>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   name="unit_price"
                                   value="{{ sale.unit_price }}"
                                   required>

                        </div>

                    </div>

                    <!-- PAYMENT -->

                    <div class="col-lg-6">

                        <label class="form-label">

                            Payment Term

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-wallet2"></i>

                            </span>

                            <select name="payment_term"
                                    class="form-select"
                                    required>

                                <option value="Cash"

                                    {% if sale.payment_term == 'Cash' %}
                                    selected
                                    {% endif %}>

                                    Cash

                                </option>

                                <option value="GPay"

                                    {% if sale.payment_term == 'GPay' %}
                                    selected
                                    {% endif %}>

                                    GPay

                                </option>

                            </select>

                        </div>

                    </div>

                </div>

                <!-- BUTTONS -->

                <div class="row btn-area g-3">

                    <div class="col-md-6">

                        <button type="submit"
                                class="update-btn">

                            <i class="bi bi-check-circle"></i>

                            Update Sale

                        </button>

                    </div>

                    <div class="col-md-6">

                        <a href="/sales-details/"
                           class="cancel-btn">

                            <i class="bi bi-x-circle"></i>

                            &nbsp;
                            Cancel

                        </a>

                    </div>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
